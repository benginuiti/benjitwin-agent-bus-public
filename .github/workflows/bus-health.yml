name: Bus Health

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check LATEST.md freshness
        id: freshness
        run: |
          set -e
          if [ ! -f reports/LATEST.md ]; then
            echo "status=missing" >> $GITHUB_OUTPUT
            echo "LATEST.md is missing"
            exit 0
          fi

          # Prefer git commit date of the file
          last_commit=$(git log -1 --format=%ct -- reports/LATEST.md 2>/dev/null || echo 0)
          now=$(date +%s)
          age_hours=$(( (now - last_commit) / 3600 ))

          echo "last_commit_unix=$last_commit" >> $GITHUB_OUTPUT
          echo "age_hours=$age_hours" >> $GITHUB_OUTPUT

          if [ "$last_commit" = "0" ]; then
            echo "status=unknown" >> $GITHUB_OUTPUT
          elif [ "$age_hours" -gt 48 ]; then
            echo "status=stale" >> $GITHUB_OUTPUT
            echo "LATEST.md is ${age_hours}h old (>48h)"
          else
            echo "status=ok" >> $GITHUB_OUTPUT
            echo "LATEST.md age: ${age_hours}h — OK"
          fi

      - name: Check NEXT.md points to an order
        id: next
        run: |
          set -e
          if grep -qiE "CLAUDE-ORD|Active order|order_id" orders/NEXT.md; then
            echo "has_order=true" >> $GITHUB_OUTPUT
            echo "NEXT.md references an active order"
          else
            echo "has_order=false" >> $GITHUB_OUTPUT
            echo "NEXT.md does not clearly reference an active order"
          fi

      - name: Write health summary
        run: |
          echo "### Bus Health $(date -u +%Y-%m-%dT%H:%MZ)" >> $GITHUB_STEP_SUMMARY
          echo "- LATEST.md status: ${{ steps.freshness.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- LATEST.md age (hours): ${{ steps.freshness.outputs.age_hours }}" >> $GITHUB_STEP_SUMMARY
          echo "- NEXT.md has active order: ${{ steps.next.outputs.has_order }}" >> $GITHUB_STEP_SUMMARY

      - name: Open issue if stale (optional guard)
        if: steps.freshness.outputs.status == 'stale'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Bus health: reports/LATEST.md is stale (>48h)';
            const body = [
              'Automated bus-health check detected that `reports/LATEST.md` has not been updated in over 48 hours.',
              '',
              'This usually means:',
              '- Local Claude has not written a receipt, or',
              '- Grok has not ferried a receipt to the bus.',
              '',
              'Protocol reminder: Claude should write `reports/LATEST.md` after machine work (or Grok may write it when push is blocked).',
              '',
              `Age (approx hours): ${{ steps.freshness.outputs.age_hours }}`,
              '',
              '— bus-health workflow'
            ].join('\n');

            // Avoid duplicate open issues with same title
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'bus-health'
            });
            const exists = issues.data.some(i => i.title === title);
            if (!exists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['bus-health']
              });
            }
