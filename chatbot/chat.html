<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Benjitwin</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0f14; --panel: #141a22; --text: #e8eef6; --muted: #8b9bb0; --accent: #3dffa8; --user: #1e3a5f; --sys: #1a242f; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); height: 100dvh; display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    header { padding: 12px 16px; border-bottom: 1px solid #243041; background: var(--panel); }
    header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
    header p { margin: 4px 0 0; font-size: 0.75rem; color: var(--muted); }
    #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
    .bubble { max-width: 92%; padding: 10px 12px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background: var(--user); }
    .sys { align-self: flex-start; background: var(--sys); border: 1px solid #2a3545; }
    .meta { display: block; margin-top: 6px; font-size: 0.7rem; color: var(--muted); }
    #composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid #243041; background: var(--panel); }
    #composer input[type=text] { flex: 1; min-height: 44px; border-radius: 10px; border: 1px solid #2a3545; background: #0d1218; color: var(--text); padding: 0 12px; font-size: 16px; }
    #composer button { min-height: 44px; min-width: 72px; border: 0; border-radius: 10px; background: var(--accent); color: #04140c; font-weight: 700; font-size: 0.9rem; }
    #composer button:disabled { opacity: 0.5; }
    #tokenBar { padding: 8px 12px; background: #1a1208; border-bottom: 1px solid #3a2a10; font-size: 0.8rem; display: none; gap: 8px; align-items: center; }
    #tokenBar input { flex: 1; min-height: 40px; font-size: 16px; border-radius: 8px; border: 1px solid #3a2a10; background: #0d1218; color: var(--text); padding: 0 10px; }
    #tokenBar.visible { display: flex; }
  </style>
</head>
<body>
  <header>
    <h1>Benjitwin</h1>
    <p>Mesh chat · intake + receipt · not multi-AI switchboard</p>
  </header>
  <div id="tokenBar">
    <input id="tokenInput" type="password" placeholder="Relay bearer token" autocomplete="off" />
    <button type="button" id="saveToken">Save</button>
  </div>
  <div id="log" aria-live="polite"></div>
  <form id="composer">
    <input id="msg" type="text" placeholder="Message Benjitwin…" autocomplete="off" enterkeyhint="send" />
    <button type="submit" id="send">Send</button>
  </form>
  <script>
    const log = document.getElementById('log');
    const msg = document.getElementById('msg');
    const form = document.getElementById('composer');
    const sendBtn = document.getElementById('send');
    const tokenBar = document.getElementById('tokenBar');
    const tokenInput = document.getElementById('tokenInput');
    const saveToken = document.getElementById('saveToken');

    function token() { return sessionStorage.getItem('BENJITWIN_RELAY_TOKEN') || ''; }
    function ensureTokenUi() {
      if (!token()) tokenBar.classList.add('visible');
      else tokenBar.classList.remove('visible');
    }
    saveToken.onclick = () => {
      const t = tokenInput.value.trim();
      if (!t) return;
      sessionStorage.setItem('BENJITWIN_RELAY_TOKEN', t);
      tokenInput.value = '';
      ensureTokenUi();
      addSys('Token saved for this browser session only.');
    };

    function addBubble(text, kind, meta) {
      const d = document.createElement('div');
      d.className = 'bubble ' + kind;
      d.textContent = text;
      if (meta) {
        const m = document.createElement('span');
        m.className = 'meta';
        m.textContent = meta;
        d.appendChild(m);
      }
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    function addSys(text, meta) { addBubble(text, 'sys', meta); }

    async function health() {
      try {
        const r = await fetch('/health');
        const j = await r.json();
        addSys('Relay online: ' + (j.status || r.status), j.service || '');
      } catch (e) {
        addSys('Relay health failed: ' + e.message);
      }
    }

    form.onsubmit = async (ev) => {
      ev.preventDefault();
      const text = msg.value.trim();
      if (!text) return;
      if (!token()) { ensureTokenUi(); addSys('Set relay token first.'); return; }
      addBubble(text, 'user');
      msg.value = '';
      sendBtn.disabled = true;
      try {
        const r = await fetch('/intention', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token()
          },
          body: JSON.stringify({
            type: 'chat',
            content: text,
            meta: { source: 'benjitwin-chat', capability: 'unresolved' }
          })
        });
        const bodyText = await r.text();
        let j = null;
        try { j = JSON.parse(bodyText); } catch (_) {}
        if (!r.ok) {
          addSys('Rejected HTTP ' + r.status, bodyText.slice(0, 240));
          return;
        }
        const rid = j && (j.receipt_id || j.receiptId);
        const hf = j && j.hub_forward;
        let reply = 'Accepted by Benjitwin intake.';
        if (rid) reply += '\nreceipt: ' + rid;
        if (hf) {
          reply += '\nhub: ' + (hf.ok ? 'ok' : 'fail');
          if (hf.work_id) reply += ' work_id=' + hf.work_id;
          if (hf.status_code) reply += ' status=' + hf.status_code;
          if (hf.detail) reply += ' (' + hf.detail + ')';
        }
        reply += '\n\n(Twin reasoning worker not attached yet — your message is on the work board with a receipt.)';
        addSys(reply, new Date().toISOString());
      } catch (e) {
        addSys('Send failed: ' + e.message);
      } finally {
        sendBtn.disabled = false;
        msg.focus();
      }
    };

    ensureTokenUi();
    health();
    addSys('Chat MVP: messages become hub work + durable receipt. Full conversational twin is the next worker bite.');
  </script>
</body>
</html>
